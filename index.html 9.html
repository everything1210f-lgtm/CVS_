ries"], "a": 3, "s": "anat"}, {"q": "A 32-year-old heavy smoker develops painful ischemia affecting the lower limb. Histological examination shows segmental inflammation of small-to-medium-sized arteries with thrombosis. Which diagnosis is most likely?", "o": ["Varicose veins", "Polyarteritis nodosa", "Thromboangiitis obliterans", "Giant cell arteritis"], "a": 2, "s": "patho"}, {"q": "What is the primary disease-modifying benefit of Mineralocorticoid Receptor Antagonists (MRAs) like Spironolactone and Eplerenone in heart failure?", "o": ["Direct arterial vasodilation to dramatically reduce left ventricular afterload", "Rapid, massive fluid diuresis to relieve pulmonary edema", "Anti-remodeling and prevention of aldosterone-driven myocardial fibrosis", "Enhancement of cardiomyocyte contractility via direct intracellular calcium influx"], "a": 2, "s": "pharma"}, {"q": "Crista terminalis is formed from which of the following?", "o": ["Sinus venosus", "Right venous valve", "Truncus arteriosus", "Common atrium"], "a": 1, "s": "anat"}, {"q": "Which of the following causes destruction and perforation of the cardiac valves?", "o": ["Acute bacterial endocarditis.", "Subacute bacterial endocarditis.", "Viral myocarditis.", "Rheumatic valvulitis."], "a": 0, "s": "patho"}, {"q": "Constrictive pericarditis is characterized by which of the following?", "o": ["Pericardial sac is obliterated restricting cardiac motility.", "Accumulation of blood inside pericardial sac.", "One form of acute pericarditis.", "One cause of acute heart failure."], "a": 0, "s": "patho"}, {"q": "Chylomicron remnants are mainly synthesized in which of the following?", "o": ["Liver", "Adipose tissue", "Liver and intestine", "Intestine"], "a": 3, "s": "bio"}, {"q": "Which combination contributes to increased stroke volume during exercise?", "o": ["Reduced venous return and reduced contractility", "Reduced respiratory depth and venoconstriction", "Reduced sympathetic activity and reduced filling", "Increased preload and increased myocardial contractility"], "a": 3, "s": "physio"}, {"q": "AV anastomoses are particularly important in the regulation of?", "o": ["Erythrocyte production", "Body temperature", "Plasma protein synthesis", "Blood glucose"], "a": 1, "s": "physio"}, {"q": "What is the approximate value of the hydrostatic pressure at the arteriolar end of a capillary?", "o": ["25 mmHg", "10 mmHg", "35 mmHg", "15 mmHg"], "a": 2, "s": "physio"}, {"q": "Which anti-anginal drug class is strictly contraindicated in vasospastic (Prinzmetal) angina?", "o": ["β-blockers", "Dihydropyridine calcium channel blockers", "Organic nitrates", "Potassium channel openers"], "a": 0, "s": "pharma"}, {"q": "A 35-year-old Indian woman was admitted to the emergency department for acute sub sternal pain at rest. She had history of shortness of breath, myalgia, nausea, vomiting and diarrhea after eating raw pork meat. The ECG showed non-specific alterations of repolarization. CBC revealed high eosinophilia. Which parasite is causing the infection?", "o": ["Toxoplasma gondii", "Trichinella spiralis", "Toxocara cati and T. canis", "Trypanosoma cruzi"], "a": 1, "s": "micro"}, {"q": "Which Class IB sodium channel blocker is administered intravenously for acute ventricular arrhythmias, particularly following acute myocardial infarction?", "o": ["Lidocaine", "Propafenone", "Quinidine", "Flecainide"], "a": 0, "s": "pharma"}, {"q": "Closure of the distal part of the left umbilical vein gives which of the following?", "o": ["Median umbilical ligament", "Ligamentum arteriosum", "Lateral umbilical ligament", "Ligamentum teres of the liver"], "a": 3, "s": "anat"}]}], "w": [{"n": "1st Week", "q": [["Enumerate the phases of the fast cardiac action potential in ordinary cardiac muscle.", "1. Phase 0: Depolarization.\n2. Phase 1: Initial repolarization.\n3. Phase 2: Plateau.\n4. Phase 3: Final repolarization.\n5. Phase 4: Resting membrane potential.", "physio"], ["What causes phase 0 of the myocardial action potential?", "Rapid opening of fast voltage-gated Na⁺ channels.", "physio"], ["What is the role of gap junctions in cardiac muscle?", "They allow rapid spread of ions and action potentials between cardiac cells.", "physio"], ["An electrophysiology study measures impulse propagation... delay of 0.16 sec... Identify the anatomical structure responsible for this delay and state its functional significance.", "The AV node; its delay allows atrial emptying before ventricular contraction and protects the ventricles from\nrapid atrial rhythms.", "physio"], ["Summarize the steps of excitation–contraction coupling in cardiac muscle from action potential to cross-bridge formation.", "Ca²⁺ entry → Ca²⁺ release from the sarcoplasmic reticulum → binding to troponin C → exposure of actin sites\n→ actin–myosin cross-bridge formation.", "physio"], ["Describe the mechanism of the Staircase Phenomenon.", "Repeated stimulation progressively increases contraction strength because of intracellular Ca²⁺ accumulation\nand incomplete Ca²⁺ reuptake.", "physio"], ["Enumerate FOUR contents of the posterior mediastinum.", "a. Descending thoracic aorta.\nb. Azygos vein.\nc. Oesophagus.\nd. Thoracic duct.", "anat"], ["Enumerate FOUR contents of the superior mediastinum.", "a. Arch of the aorta.\nb. Brachiocephalic veins.\nc. Trachea.\nd. Oesophagus.", "anat"], ["Mention the pericardial sinuses of the heart.", "a. Oblique pericardial sinus.\nb. Transverse pericardial sinus.", "anat"], ["What is the part forming apex of the heart and mention its surface anatomy?", "The apex is formed by the left ventricle and lies in the left fifth intercostal space, 9 cm from the midline.", "anat"], ["List openings into the right atrium of the heart.", "a. Superior vena cava.\nb. Inferior vena cava.\nc. Coronary sinus.\nd. Right atrioventricular orifice.\ne. Anterior cardiac veins.\nf. Venae cordis minimae.", "anat"], ["Complete: Coronary sinus is the continuation of ______ and ends in ______.", "Great cardiac vein; right atrium.", "anat"], ["Complete: Coronary arteries are branches of ______.", "Ascending aorta.", "anat"], ["Complete: Right subclavian artery is a branch of ______.", "Brachiocephalic artery.", "anat"], ["Complete: Arch of aorta is the continuation of ______.", "Ascending aorta.", "anat"], ["Complete: Azygos vein opens into ______.", "Superior vena cava.", "anat"], ["Enumerate THREE branches of the arch of aorta.", "a. Brachiocephalic artery.\nb. Left common carotid artery.\nc. Left subclavian artery.", "anat"], ["Mention TWO branches of left coronary artery.", "a. Anterior interventricular artery.\nb. Circumflex artery.", "anat"], ["Mention TWO branches of right coronary artery.", "a. Marginal artery.\nb. Posterior interventricular artery.", "anat"], ["What are the tributaries of the coronary sinus?", "a. Great cardiac vein.\nb. Middle cardiac vein.\nc. Small cardiac vein.\nd. Oblique vein of the left atrium.\ne. Posterior vein of the left ventricle.", "anat"], ["List layers of the heart.", "1. Epicardium.\n2. Myocardium.\n3. Endocardium.", "anat"], ["Describe LM of cardiac muscles.", "Short, branched, striated cells with one or two central nuclei and intercalated discs.", "histo"], ["Define cardiac diads.", "One T-tubule associated with one sarcoplasmic reticulum cisterna at the Z-line.", "histo"], ["Enumerate parts of intercalated disc.", "1. Fascia adherens.\n2. Desmosomes.\n3. Gap junctions.", "histo"], ["Describe pericardium.", "A fibroserous sac surrounding the heart. It consists of an outer fibrous pericardium and an inner serous\npericardium with parietal and visceral layers.", "anat"], ["Compare between cardiac muscles and conducting fibers.", "Cardiac muscles: Smaller and contractile; One or two central nuclei; Numerous myofilaments; More deeply\nstained.\nConducting fibers: Larger and conduct impulses; One or two peripheral nuclei; Fewer myofilaments; Pale,\nglycogen-rich cytoplasm.", "histo"]]}, {"n": "2nd Week", "q": [["Complete: Coronary sinus is the continuation of ______ and ends in ______.", "Great cardiac vein; right atrium.", "anat"], ["Complete: Coronary arteries are branches of ______.", "Ascending aorta.", "anat"], ["Complete: Right subclavian artery is a branch of ______.", "Brachiocephalic artery.", "anat"], ["Complete: Arch of aorta is the continuation of ______.", "Ascending aorta.", "anat"], ["Complete: Azygos vein opens into ______.", "Superior vena cava.", "anat"], ["Enumerate THREE branches of the arch of aorta.", "1. Brachiocephalic artery\n2. Left common carotid artery\n3. Left subclavian artery", "anat"], ["Mention TWO branches of the left coronary artery.", "1. Anterior interventricular (descending) artery\n2. Circumflex artery", "anat"], ["Mention TWO branches of the right coronary artery.", "1. Marginal branch\n2. Posterior interventricular branch", "anat"], ["What are the tributaries of the coronary sinus?", "1. Great cardiac vein\n2. Middle cardiac vein\n3. Small cardiac vein\n4. Oblique vein of left atrium\n5. Posterior vein of left ventricle", "anat"], ["What are the three standard bipolar limb leads of ECG?", "• Lead I: Right arm (−) → Left arm (+)\n• Lead II: Right arm (−) → Left leg (+)\n• Lead III: Left arm (−) → Left leg (+)", "physio"], ["Describe the normal ECG waves.", "• P wave: atrial depolarization.\n• QRS complex: ventricular depolarization.\n• T wave: ventricular repolarization.", "physio"], ["Why is the atrial repolarization wave not normally seen?", "Because it is masked by the QRS complex and has a low voltage.", "physio"], ["What is the PR interval and what is its normal duration?", "Measured from the beginning of the P wave to the beginning of the QRS complex. It represents conduction of impulses from the atria to the ventricles.\nNormal duration: 0.12–0.20 second.", "physio"], ["List types of blood vessels.", "1. Large elastic arteries\n2. Medium muscular arteries\n3. Small arteries (arterioles)\n4. Veins\n5. Capillaries", "histo"], ["Describe the structure of the aorta.", "Tunica intima: endothelium, narrow subendothelial connective tissue, internal elastic lamina present but indistinct.\nTunica media: thickest layer; fenestrated elastic lamellae alternating with smooth muscle cells.\nTunica adventitia: thin fibroelastic connective tissue containing vasa vasorum.", "histo"], ["Describe the wall of arterioles.", "• Narrow lumen, relatively thick wall\n• Thin tunica intima lined by endothelium\n• Tunica media of a few layers of smooth muscle fibers\n• Very thin tunica adventitia", "histo"], ["Compare between medium-sized artery and medium-sized vein.", "Artery: thick wall, narrow circular lumen, no valves, thick tunica media.\nVein: thin wall, usually collapsed lumen, valves may be present, thin tunica media.", "histo"], ["Describe the histology of the basilar artery.", "• Specialized medium-sized artery\n• Thin wall, thin tunica media devoid of elastic fibers\n• Well-developed internal elastic lamina", "histo"]]}, {"n": "3rd Week", "q": [["Pathologic lesion of rheumatic carditis", "Aschoff body (Aschoff nodule).", "patho"], ["Gross and microscopic picture of rheumatic carditis", "Gross: tiny gray-white Aschoff nodules (1–2 mm); heart muscle swollen and flabby.\nMicroscopic: fibrinoid degeneration of collagen; macrophages, lymphocytes, plasma cells; Anitschkow cells and Aschoff giant cells.", "patho"], ["Four complications of rheumatic heart disease", "A. Subacute bacterial endocarditis\nB. Heart failure\nC. Embolic manifestations (multiple infarctions)\nD. Cardiac arrhythmias", "patho"], ["Morphology of chronic rheumatic pericarditis", "• Milk patches of fibrosis\n• Adhesive pericarditis\n• Mediastino-pericarditis", "patho"], ["Gross and microscopic picture of rheumatic vegetations", "Gross: multiple small gray firm sterile vegetations along the line of valve closure.\nMicroscopic: edematous vascular cusps; mononuclear inflammatory infiltrate; platelet and fibrin vegetations.", "patho"], ["Pathogenesis of rheumatic fever", "Following Group A streptococcal pharyngitis, antibodies formed against M protein cross-react with cardiac tissues, causing autoimmune inflammation and tissue damage.", "patho"], ["Indications and contraindications of ACEIs & ARBs", "Preferred indications: diabetic/proteinuric CKD; post-myocardial infarction.\nAbsolute contraindications: pregnancy; bilateral renal artery stenosis.", "pharma"], ["Hypertensive emergency vs hypertensive urgency", "Emergency: severe hypertension with acute target-organ damage; IV medications; gradual BP reduction (DBP about 100–110 mmHg initially).\nUrgency: severe hypertension without target-organ damage; oral medications.", "pharma"], ["Mechanism of action of dihydropyridine CCBs", "They block L-type calcium channels in vascular smooth muscle, causing vasodilation, decreased peripheral vascular resistance, and decreased blood pressure.", "pharma"], ["Clinical use and adverse effect of diuretics", "Thiazides: mild to moderate hypertension; hypokalemia.\nLoop diuretics: hypertensive emergency / pulmonary edema; hypokalemia.", "pharma"], ["Preferred antihypertensive drugs", "A. Post-MI: beta-blockers, ACE inhibitors, ARBs\nB. Pregnancy: methyldopa, labetalol, nifedipine\nC. Diabetes with CKD: ACE inhibitors, ARBs, RAAS inhibitors", "pharma"], ["Function of the vasoconstrictor center", "It increases sympathetic outflow to blood vessels causing vasoconstriction, increased peripheral resistance, and increased arterial blood pressure.", "physio"], ["Vagal tone of the heart", "Continuous parasympathetic (vagal) activity that decreases heart rate and cardiac output.", "physio"], ["Mary's law of baroreceptors", "An increase in arterial blood pressure increases baroreceptor firing, producing reflex reduction of heart rate and blood pressure.", "physio"], ["Effect of pain and oculo-cardiac reflex on heart rate", "• Pain usually causes tachycardia.\n• Oculo-cardiac reflex causes bradycardia.", "physio"], ["Cardiac output and normal resting value", "Cardiac output is the volume of blood pumped by the heart per minute.\nCO = Stroke Volume × Heart Rate\nNormal resting value ≈ 5 L/min.", "physio"], ["Main factors controlling cardiac output", "• Heart rate\n• Stroke volume", "physio"], ["Afterload and its effect on cardiac output", "Afterload is the resistance against which the ventricle pumps blood. Increased afterload decreases stroke volume and cardiac output.", "physio"], ["Role of heart rate in increasing cardiac reserve during exercise", "During exercise, heart rate increases, leading to increased cardiac output and increased cardiac reserve to meet the body's metabolic demands.", "physio"]]}, {"n": "4th Week", "q": [["Enumerate types of endocarditis.", "Non-infective endocarditis:\n• Rheumatic endocarditis\n• Atypical verrucous (Libman-Sacks) endocarditis in SLE\n• Non-bacterial thrombotic (terminal) endocarditis\n• Carcinoid endocarditis\nInfective endocarditis:\n• Acute bacterial endocarditis\n• Subacute bacterial endocarditis (SABE)\n• Fungal and viral endocarditis\n• Chronic endocarditis (e.g. tuberculosis, syphilis)", "patho"], ["Enumerate complications of acute bacterial endocarditis.", "• Severe myocardial degenerative changes\n• Embolic lesions due to detachment of septic vegetations leading to systemic pyemia and pyaemic abscesses\n• Severe toxemia, septicemia and pyaemia\n• Cusp perforation\n• Heart failure", "patho"], ["Enumerate complications of subacute bacterial endocarditis.", "• Infarction of kidney, brain and spleen\n• Retinal necrosis and blindness\n• Coronary artery embolism (rare)\n• Mycotic aneurysms in cerebral and mesenteric arteries\n• Osler nodules\n• Focal glomerulonephritis\n• Moderate toxemia causing fever, anemia, clubbing of fingers, splenomegaly and petechial hemorrhage\n• Valve stenosis or incompetence leading to heart failure\n• Renal failure", "patho"], ["Enumerate types of acute pericarditis.", "• Serous pericarditis\n• Fibrinous (serofibrinous) pericarditis\n• Suppurative pericarditis\n• Hemorrhagic pericarditis\n4th Week Assignment", "patho"], ["Enumerate types of chronic pericarditis.", "• Adherent mediastino-pericarditis\n• Constrictive pericarditis\n• Tuberculous pericarditis", "patho"], ["Compare between acute and subacute bacterial endocarditis.", "TABLE\nFeature~Acute (ABE)~Subacute (SABE)\nOrganisms~highly virulent pyogenic (e.g. Staphylococcus)~low virulent non-pyogenic (e.g. Streptococcus viridans)\nOccurrence~during septicemia~during bacteremia\nValves affected~healthy valves~diseased / predisposed valves\nValvular damage~more~less\nInflammation~severe~mild\nAge~usually older (50–60 years)~young age and children\nValve destruction~ulceration, perforation or rupture~slow and mild damage\nVegetations~large, globular, soft, friable, easily detached~large, polypoid, friable, easily detached\nEmboli~septic emboli causing pyemia and pyaemic abscesses~aseptic emboli causing infarction\nCourse~rapid, fatal~slow\nCauses of death~septicemia, valve perforation, heart failure~heart failure, embolic complications, renal failure, cerebral hemorrhage\nMortality~high~low", "patho"], ["Compare between rheumatic vegetation and infective endocarditis vegetation.", "TABLE\nFeature~Rheumatic Vegetation~Infective Endocarditis Vegetation\nSize~small~large\nConsistency~firm~friable / soft\nAppearance~warty~soft, bulky\nArrangement~along line of closure~anywhere on valve cusps\nAttachment~difficult to detach~easily detached\nContent~sterile (non-infective)~bacteria with fibrin and platelets", "patho"]]}, {"n": "SAQs", "q": [["Identify two strict drug class combinations that must be avoided in hypertension management, explaining the clinical or physiological rationale for each.", "• ACEI + ARB: causes excessive RAAS blockade, hyperkalemia and renal impairment.\n• Beta blocker + Verapamil/Diltiazem: may cause severe bradycardia and AV block.", "pharma"], ["A hypertensive patient taking an ACE inhibitor develops a persistent dry cough. (a) Which antihypertensive drug class should replace the ACE inhibitor? (b) Explain the mechanism of action of this replacement drug class.", "(a) ARBs.\n(b) They block AT1 receptors, preventing angiotensin II effects including vasoconstriction and aldosterone release.", "pharma"], ["State the main advantage of Angiotensin Receptor Blockers (ARBs) over ACE Inhibitors (ACEIs), and explain the pharmacological rationale for this difference.", "ARBs do not cause dry cough because they do not increase bradykinin levels.", "pharma"], ["Describe the histology of Purkinje fibers.", "Large pale modified cardiac muscle fibers beneath endocardium, rich in glycogen, with 1–2 peripheral\nnuclei.", "histo"], ["Describe the histology of the wall of arterioles.", "Thin intima, few layers of smooth muscle in media, and thin adventitia.", "histo"], ["Describe histology of basilar artery.", "Thin wall, thin media lacking elastic fibers, and prominent internal elastic lamina.", "histo"], ["Define excitability in cardiac muscle.", "Ability of cardiac muscle to respond to a stimulus by generating an action potential.", "physio"], ["Mention the two types of cardiac cells.", "Contractile cells and autorhythmic (pacemaker/conducting) cells.", "physio"], ["Enumerate the phases of the fast cardiac action potential.", "• Phase 0: Rapid depolarization\n• Phase 1: Initial rapid repolarization\n• Phase 2: Plateau phase\n• Phase 3: Rapid repolarization\n• Phase 4: Resting membrane potential", "physio"], ["What causes phase 0 of the myocardial action potential?", "Rapid Na+ influx through fast sodium channels.", "physio"], ["Explain the cause and importance of the plateau phase.", "Caused by Ca2+ influx balanced by K+ efflux; prolongs contraction and prevents tetany.", "physio"], ["Outline the cardiac conduction system pathways and state their respective conduction velocities.", "• Internodal fibers: 1 m/s\n• AV node: 0.05 m/s\n• His-Purkinje: about 4 m/s", "physio"], ["What is the primary physiological benefit of the AV nodal delay during the cardiac cycle?", "Allows complete ventricular filling after atrial contraction.", "physio"], ["Why is the atrial repolarization wave not normally seen?", "It is masked by the QRS complex and has low voltage.", "physio"], ["Describe the QRS complex.", "Represents ventricular depolarization.", "physio"], ["What is the PR interval and what is its normal duration?", "Interval from beginning of P to beginning of QRS; 0.12–0.20 sec.", "physio"], ["What is the significance of the ST segment?", "Represents ventricular plateau phase and should be isoelectric.", "physio"], ["What is the QT interval?", "From start of QRS to end of T wave; represents ventricular depolarization and repolarization.", "physio"], ["What is the significance of the Protodiastolic Phase (PDP) and how does it relate to the aortic pressure curve?", "Transition between systole and diastole; ventricular pressure falls and aortic pressure continues\ndescending before valve closure.", "physio"], ["Explain what happens to ventricular pressure, ventricular volume, and heart valves during the Isometric Contraction Phase (ICP).", "Pressure rises rapidly, volume remains constant, all valves are closed.", "physio"], ["What is the carotid sinus syndrome?", "Hypersensitive carotid sinus causing bradycardia, vasodilation and syncope.", "physio"], ["Describe the Bainbridge reflex.", "Increased venous return stretches atria leading to reflex tachycardia.", "physio"], ["Define heart failure and mention its major causes.", "Failure of heart to pump enough blood. Major causes: IHD, hypertension, valvular disease and\ncardiomyopathy.", "physio"], ["Explain how increased venous return affects cardiac output.", "Increases EDV, stroke volume and cardiac output by Frank-Starling mechanism.", "physio"], ["Define afterload and explain its effect on cardiac output.", "Resistance against ventricular ejection; increased afterload decreases cardiac output.", "physio"], ["What are the main f let W;function openW(k){PH=0;W0=W=D.w[k];fl='all';wList();go('as')}let PH=0;function sw(c){return '<div class="seg"><button class="'+(c?'':'on')+'" onclick="phSw(0)">MCQs<b>'+D.ph.m.length+'</b></button><button class="'+(c?'on':'')+'" onclick="phSw(1)">SAQs<b>'+D.ph.s.length+'</b></button></div>'}function openP(){phSw(0)}function phSw(k){PH=1;fl='all';if(k==0){S0=S={t:'Physiology – MCQs',q:D.ph.m,nc:1};ans=[];cf=[];fList(0);go('qz')}else{W0=W={n:'Physiology – SAQs',q:D.ph.s,nc:1};wList();go('as')}}

function wCards(n){md='wc';cn=n;const x=W.q[n],T=W.q.length;$('#as').innerHTML=`<div class="wrap"><div class="top card"><div><h2>${W.n}</h2><small>Question ${n+1} / ${T}</small></div><button class="g" onclick="wList()">List</button></div>${W0.nc?'':chips(W0.q,'setC',1)}<div class="bar"><u style="width:${(n+1)/T*100}%"></u></div><div class="q card big"><div class="qt">${esc(x[0])}</div><div class="ans" id="a" hidden>${A(x[1])}</div></div><button class="g w" id="t" onclick="tg('')">Show Answer</button><div class="nav"><button class="g" onclick="${n?`wCards(${n-1})`:'wList()'}">Back</button><button class="b" ${n==T-1?'disabled':''} onclick="wCards(${n+1})">Next</button></div></div>`;scrollTo(0,0)}
const cv=$('#pc'),cx=cv.getContext('2d');let cw,ch,ox,oy,iw,ih;
function rs(){cw=cv.width=innerWidth;ch=cv.height=innerHeight;const s=Math.max(cw/2560,ch/1440);iw=2560*s;ih=1440*s;ox=(cw-iw)*.72;oy=(ch-ih)*.5}rs();addEventListener('resize',rs);
const VS=[
{p:[[.61,-.02],[.617,.1],[.62,.2],[.622,.3],[.63,.36]],w:.026,ox:0,ar:0,n:20},
{p:[[.635,1.02],[.63,.92],[.62,.84],[.6,.76],[.585,.68],[.585,.62]],w:.026,ox:0,ar:0,n:20},
{p:[[.725,.4],[.76,.355],[.81,.345],[.855,.375],[.885,.45],[.91,.55],[.945,.66],[.975,.77],[1.01,.84]],w:.022,ox:0,ar:1,n:24},
{p:[[.672,.311],[.656,.239],[.681,.183],[.725,.13],[.781,.113],[.834,.139],[.878,.186],[.9375,.194],[1.02,.14]],w:.018,ox:1,ar:1,n:22},
{p:[[.66,.24],[.654,.14],[.653,.05],[.653,-.02]],w:.02,ox:1,ar:1,n:12},
{p:[[1.02,.47],[.95,.44],[.89,.4],[.84,.39]],w:.01,ox:1,ar:0,n:8},
{p:[[1.02,.72],[.97,.6],[.92,.5],[.88,.43]],w:.01,ox:1,ar:0,n:8},
{p:[[.775,.43],[.755,.55],[.73,.68],[.725,.8]],w:.006,ox:0,ar:0,n:5}];
function cr(P,t){const n=P.length-1,u=Math.min(.9999,Math.max(0,t))*n,i=Math.floor(u),f=u-i,g=k=>P[Math.max(0,Math.min(n,k))],a=g(i-1),b=g(i),c=g(i+1),d=g(i+2),f2=f*f,f3=f2*f,h=(q,r,s2,t2)=>.5*((2*r)+(-q+s2)*f+(2*q-5*r+4*s2-t2)*f2+(-q+3*r-3*s2+t2)*f3);return[h(a[0],b[0],c[0],d[0]),h(a[1],b[1],c[1],d[1])]}
const PT=[];VS.forEach((v,vi)=>{for(let m=0;m<v.n;m++){const r=Math.random(),ty=r<.05?2:r<.15?1:0;PT.push({vi,t:Math.random(),v:.0011+Math.random()*.0012,ty,sz:ty==2?1.7:ty==1?.38+Math.random()*.1:.85+Math.random()*.3,a:Math.random()*6.28,av:(Math.random()-.5)*.06,tl:Math.random()*6.28,tv:.015+Math.random()*.035,off:(Math.random()+Math.random()-1),z:.75+Math.random()*.45})}});
function rbc(x,y,R,a,sq,ox2,al){const c=cx;c.save();c.globalAlpha=al;c.translate(x,y);c.rotate(a);c.scale(1,sq);
c.shadowColor='rgba(0,0,0,.55)';c.shadowBlur=R*.6;c.shadowOffsetY=R*.25;

let g=c.createRadialGradient(0,0,R*.04,0,0,R);g.addColorStop(0,d[0]);g.addColorStop(.26,d[1]);g.addColorStop(.6,d[2]);g.addColorStop(.86,d[3]);g.addColorStop(1,d[4]);

function wbc(x,y,R,a,al){const c=cx;c.save();c.globalAlpha=al;c.translate(x,y);c.rotate(a);c.shadowColor='rgba(0,0,0,.5)';c.shadowBlur=R*.4;
let g=c.createRadialGradient(-R*.3,-R*.35,R*.1,0,0,R);g.addColorStop(0,'#fbf8ff');g.addColorStop(.65,'#dcd3ea');g.addColorStop(1,'#9d90b8');

const L=[[-.38,-.12,.4],[.08,.3,.38],[.34,-.2,.34],[-.05,-.35,.3]];for(const[ax,ay,r]of L){const gg=c.createRadialGradient(R*ax-R*.05,R*ay-R*.05,0,R*ax,R*ay,R*r);gg.addColorStop(0,'#7a54b0');gg.addColorStop(1,'#4b2a82');c.beginPath();c.arc(R*ax,R*ay,R*r,0,7);c.fillStyle=gg;c.fill()}
c.fillStyle='rgba(255,255,255,.35)';for(let q=0;q<9;q++){const t=q*2.4;c.beginPath();c.arc(Math.cos(t)*R*.7*((q%3+1)/3),Math.sin(t)*R*.7*((q%3+1)/3),R*.045,0,7);c.fill()}
c.lineWidth=R*.06;c.strokeStyle='rgba(60,40,100,.55)';c.beginPath();c.arc(0,0,R*.97,0,7);c.stroke();c.restore()}
function plt(x,y,R,a,al){const c=cx;c.save();c.globalAlpha=al;c.translate(x,y);c.rotate(a);c.scale(1,.62);let g=c.createRadialGradient(-R*.3,-R*.3,0,0,0,R);g.addColorStop(0,'#fde3ea');g.addColorStop(1,'#c98a9d');c.beginPath();c.arc(0,0,R,0,7);c.fillStyle=g;c.fill();c.lineWidth=R*.15;c.strokeStyle='rgba(120,50,75,.6)';c.stroke();c.restore()}
function loop(){lp=0;return;cx.clearRect(0,0,cw,ch);const U=Math.max(.7,Math.min(1.6,iw/1550)),ph=performance.now()/1100*6.283,pu=1+.7*Math.pow(Math.max(0,Math.sin(ph)),2);
const ord=PT.slice().sort((A,B)=>A.z-B.z);
for(const q of PT){const V=VS[q.vi];q.t+=q.v*(1-.65*q.off*q.off)*(V.ar?pu:1);if(q.t>1)q.t-=1;q.a+=q.av;q.tl+=q.tv}
for(const q of ord){const V=VS[q.vi],P=cr(V.p,q.t),P2=cr(V.p,q.t+.01);let tx=P2[0]-P[0],ty=P2[1]-P[1];const ln=Math.hypot(tx,ty)||1;tx/=ln;ty/=ln;
const taper=V.ar&&V.p.length>6?1-.35*q.t:1,wd=V.w*taper*iw,x=ox+P[0]*iw+(-ty)*q.off*wd*.42,y=oy+P[1]*ih+(tx)*q.off*wd*.42,R=q.sz*q.z*Math.min(13,Math.max(4,wd*.3))*(U*.9+.1),al=Math.min(1,q.t*10,(1-q.t)*10)*(.7+.3*q.z);
if(q.ty==2&&V.w>.015)wbc(x,y,R*.85,q.a,al);else if(q.ty==1)plt(x,y,R*.7,q.a,al);else rbc(x,y,R,q.a,.4+.6*Math.abs(Math.cos(q.tl)),V.ox==1,al)}
requestAnimationFrame(loop)}
